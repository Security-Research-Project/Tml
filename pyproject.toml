[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tml"
version = "0.1.0"
description = "Securely download, verify, and install Tor Browser, Mullvad Browser, and LibreWolf"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "urllib3>=1.26",
]

[project.scripts]
tml = "tml.gui:main"

[tool.setuptools]
packages = ["tml", "tml.browsers"]
include-package-data = true

[tool.setuptools.package-data]
tml = ["data/apparmor/*.template", "data/keys/*", "data/icons/*.svg"]
